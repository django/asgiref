[tool:pytest]
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope=function

[flake8]
exclude = venv/*,tox/*,specs/*
ignore = E123,E128,E266,E402,E704,W503,E731,W601,E203
max-line-length = 119

[isort]
profile = black
multi_line_output = 3

[mypy]
warn_unused_ignores = True
strict = True

[mypy-asgiref.current_thread_executor]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-asgiref.local]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-asgiref.sync]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-asgiref.compatibility]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-asgiref.wsgi]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-asgiref.testing]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-asgiref.server]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-test_server]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-test_wsgi]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-test_testing]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-test_sync_contextvars]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-test_sync]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-test_local]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-test_compatibility]
disallow_untyped_defs = False
check_untyped_defs = False
